<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Homing">
  <!--
    卡通信鸽，飞行姿态。风格与控制台一致：粗黑描边 + 平涂亮色，无渐变无阴影。

    三个约束决定了这个画法：
      1. **16px 的标签页上还要认得出是只鸟** —— 所以只有四块形状，
         描边粗到 3，细节一律砍掉。尾巴并进身体轮廓，不做独立形状，
         否则小尺寸下会散成两团。
      2. **要能当安卓自适应图标** —— 主体收在中心安全区内，
         被圆形或方形裁切都切不到头。
      3. 翅膀上扬、身体前倾，靠姿态传达「在飞」——信鸽的意思在姿态里，
         不靠加信封之类的道具，那些在小尺寸下只会变成噪点。
  -->
  <g stroke="#12100e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- 身体：尾巴是同一条路径的一部分，不是拼上去的 -->
    <path fill="#66d9ef"
          d="M47 27 C53 32 52 42 43 47 C34 52 22 49 17 43 L4 47 L12 34 C15 26 25 21 33 21 C40 21 45 23 47 27 Z"/>
    <!-- 翅膀：往左下让开头部，否则会被头压住、看起来像肚皮上的一块色 -->
    <path fill="#ffd93d" d="M17 39 C19 28 29 24 38 30 C33 39 25 43 17 39 Z"/>
    <!-- 头 -->
    <circle cx="45" cy="21" r="10.5" fill="#66d9ef"/>
    <!-- 喙 -->
    <path fill="#ffa552" d="M54 18 L63 22 L54 26 Z"/>
  </g>
  <!-- 眼睛：实心点。小尺寸下它是「这是只鸟」最强的信号 -->
  <circle cx="48" cy="18" r="2.5" fill="#12100e"/>
</svg>
