<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>桌3</title>
<link rel="stylesheet" href="/style.css"><style>
 body{margin:0;padding:0}
 .pad{padding:28px 0}
 .vdev{width:min(352px,88vw);border:var(--bw) solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;position:relative;z-index:1}
 .vdev-wrap{position:relative}
 .vdev-bar{display:flex;align-items:center;gap:7px;padding:7px 11px;border-bottom:var(--bw) solid var(--line);font-size:11px;font-weight:700;color:var(--muted)}
 .vdev-bar b{margin-left:auto;color:var(--fg)}
 .vlive{width:8px;height:8px;border-radius:50%;background:var(--mint);border:1.5px solid var(--line);flex:none}
 .vdev-scr{position:relative;min-height:118px}
 .scr-idle{display:none}
 .vmsg{position:absolute;left:12px;right:12px;top:14px;border:var(--bw) solid var(--line);border-radius:13px 13px 13px 4px;background:var(--cyan);color:var(--on-bright);padding:10px 12px;font-size:14px;line-height:1.55}
 .vmsg b{display:block;font-size:11px;margin-bottom:3px;opacity:.7}
 .vswap{position:relative;display:inline-block;width:3.1em;text-align:center}
 .vswap i{font-style:normal;font-weight:800}
 .vswap .mask{display:none}
 .vhomi{position:absolute;right:-4px;top:-40px;width:50px;height:50px}
 .vding{display:none}
 .vtag{margin:0;font-size:11px;font-weight:700;color:var(--muted);text-align:center}
</style><style>/* ══ 场景一：床头柜上的那台 ═══════════════════════════════════
   上一版是「一块板加两条腿」：读起来像长凳，而且手机比桌子还宽，
   整幕像一张示意图而不是房间的一角。这一版换成一件有体积的家具——
   柜面 + 一只带把手的抽屉 + 矮脚，左边一盏亮着的台灯，头顶一弯月，
   右下角一根垂到画外的充电线。三句话一次说清：在家里、插着电、夜里也在收。 */

/* 页面里已有的外层，照抄一遍好让这一块自成一体 */
.deskset { display: flex; flex-direction: column; align-items: center; width: 100% }

.dnightstand-scene {
  /* --pw 就是手机卡片那条宽度表达式，柜子是它的 1.34 倍。
     两边各写各的（卡片 88vw、柜子 96vw）一定会在某个宽度上对不齐；
     从同一个变量推出来，任何视口下 SVG 坐标与卡片的相对位置都是常数。
     1.34 × 74vw = 99.16vw，永远塞得进视口，body 不会横向滚动
     （实测 320 / 360 / 390 / 402 / 430 / 1200 六档 scrollWidth 都不溢出）。 */
  --pw: min(296px, 74vw);
  position: relative;
  width: calc(var(--pw) * 1.34);
  /* 月亮和台灯是绝对定位的，不占高度。不在这儿把头顶的位置留出来，
     它们会压到上面那行大标题上。.17 是最高那颗星实测的溢出量。 */
  margin-top: calc(var(--pw) * .17);
}

/* 卡片比原来的 352px 窄一点——柜面左边那条 79 个坐标单位的空当就是从这儿来的，
   没有它台灯只能画成一根牙签。正文仍然是两行，屏幕里还剩 20px 余量（各宽度实测）。 */
.dnightstand-scene .vdev { width: var(--pw) }

/* 手机靠右放，左边整条留给台灯：床头柜上本来就是一边一件。
   靠右用百分比 padding，跟着场景一起缩。 */
.dnightstand-stage {
  position: relative;
  display: flex; justify-content: flex-end;
  padding-right: 5.2%;
}

/* 台灯与光锥贴的是舞台**底边**：唯一要紧的对齐是「灯站在柜面上」，
   而柜面就是卡片的下沿。 */
.dnightstand-lamp {
  position: absolute; left: 0; bottom: 0; width: 100%; height: auto;
  z-index: 0; pointer-events: none;
}

/* 月与星单独一张，贴卡片**顶边**。和台灯共用一张的话会漂：
   SVG 按宽度等比缩放，而卡片高度是固定的 155px，窄屏上这张图比卡片矮一截，
   底边对齐了顶边就差十几个像素，月亮被手机吃掉半个。分两张各贴一边，两头都不会漂。 */
.dnightstand-sky {
  position: absolute; left: 0; top: calc(var(--pw) * -.155); width: 100%; height: auto;
  z-index: 0; pointer-events: none;
}

/* 柜子本体。z-index 2 压在卡片（.vdev 自带 z-index 1）之上，
   于是顶上那块托架把手机底沿咬住、接缝看不见。
   负的上外边距写成百分比（4.103% = 16/390），缩放时这 16 个坐标单位的咬合量不变。 */
.dnightstand-stand {
  position: relative; z-index: 2;
  display: block; width: 100%; height: auto;
  margin-top: -4.103%;
}

/* 旧的 .desk / .desk i / .deskset { --legh } 三条可以一起删掉，已经没人用了。 */</style></head><body><div class="pad"><div class="deskset">
  <div class="dnightstand-scene">
    <div class="dnightstand-stage">

      <!-- 月与星：这一幕唯一的「夜」信号，放在台灯和鸽子之间那条空带上。
           它贴的是卡片**顶边**，所以任何宽度下都在手机上方，不会被吃掉。 -->
      <svg class="dnightstand-sky" viewBox="0 0 390 54" aria-hidden="true">
        <g stroke="var(--line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <path fill="var(--yellow)" d="M146.62 7.06 A15 15 0 1 0 161.68 28.15 A13 13 0 0 1 146.62 7.06 Z"/>
          <path fill="var(--yellow)" transform="translate(196 12)" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z"/>
          <path fill="var(--yellow)" transform="translate(106 30)" d="M0 -6 Q1 -1 6 0 Q1 1 0 6 Q-1 1 -6 0 Q-1 -1 0 -6 Z"/>
        </g>
      </svg>

      <!-- 台灯。坐标系 390×214：底边 y=214 就是柜面，卡片左沿落在 x≈79。
           整盏灯画在 x<72 这条空当里，任何缩放下都不会被手机盖住半截。
           每个 path 都显式写了 fill —— 不写的话浏览器按默认的黑色实心画，
           深色主题下整盏灯是一团黑疙瘩。 -->
      <svg class="dnightstand-lamp" viewBox="0 0 390 214" aria-hidden="true">
        <!-- 光锥：从灯罩口一直铺到柜面。右半边被手机挡掉，看起来就是光落在它身上。
             底边不描线——那条线正好压在 SVG 底边上会被裁掉一半，
             而柜面顶沿本来就有自己那道描边。 -->
        <path fill="var(--yellow)" d="M14 100 L64 100 L118 214 L7 214 Z"/>
        <path fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round" d="M14 100 L7 214 M64 100 L118 214"/>
        <!-- 灯杆：粗描边一遍当轮廓、细描边一遍当填色。直接画一条细线就是根火柴。 -->
        <path fill="none" stroke="var(--line)" stroke-width="9" stroke-linecap="round" d="M39 206 L39 86"/>
        <path fill="none" stroke="var(--card)" stroke-width="4" stroke-linecap="round" d="M39 206 L39 86"/>
        <g stroke="var(--line)" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
          <!-- 灯座与灯罩同是上窄下宽的梯形：两个形状押韵，缩到 16px 也还认得出是一盏灯 -->
          <path fill="var(--card)" d="M24 198 L54 198 L66 214 L12 214 Z"/>
          <path fill="var(--orange)" d="M22 56 L56 56 L68 98 L10 98 Z"/>
        </g>
      </svg>

      <div class="vdev-wrap">
        <div class="vdev-wrap">
            <div class="vdev">
              <div class="vdev-bar"><span class="vlive"></span>在线 · 充电中<b id="v2_clock">22:16</b></div>
              <div class="vdev-scr">
                <p class="scr-idle"><i></i><b>收到新消息</b><span>1 条未读</span></p>
                <div class="vmsg">
                  <b>95588</b>【招商银行】您的验证码是<span class="vswap"><i class="plain">1357</i><i class="mask">••••</i></span>，5 分钟内有效。
                </div>
              </div>
            </div>
            <span class="vding">叮</span>
            <svg class="vhomi" viewBox="0 0 64 64" aria-hidden="true">
              <g stroke="var(--line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
                <path d="M30 52 L30 58 M38 52 L38 58"/>
                <path fill="var(--cyan)" d="M20 52 C12 46 14 32 26 27 C36 23 46 26 49 34 C52 42 46 51 36 53 Z"/>
                <path fill="var(--yellow)" d="M26 36 C31 31 39 32 43 38 C38 45 30 45 26 36 Z"/>
                <circle cx="27" cy="21" r="9" fill="var(--cyan)"/>
                <path fill="var(--orange)" d="M18 19 L9 22 L18 25 Z"/>
              </g>
              <circle cx="24" cy="18" r="2.5" fill="var(--line)"/>
            </svg>
          </div>
          <div class="desk"><i class="l"></i><i class="r"></i></div>
      </div>
    </div>

    <!-- 床头柜：柜面 + 抽屉 + 把手 + 矮脚 + 一根充电线。
         坐标系 390×124，y=16 是柜面顶沿，也就是卡片的下沿。
         整张压在卡片之上（z-index 2），所以最上面那块托架能把手机底沿咬住，
         接缝与对齐误差一起藏进去。 -->
    <svg class="dnightstand-stand" viewBox="0 0 390 124" aria-hidden="true">
      <g stroke="var(--line)" stroke-linejoin="round" stroke-linecap="round">
        <rect x="4" y="16" width="382" height="18" rx="3" fill="var(--card)" stroke-width="3.4"/>
        <rect x="22" y="34" width="346" height="64" rx="3" fill="var(--card)" stroke-width="3.4"/>
        <!-- 抽屉面是这件家具唯一的色块。不给它颜色，浅色主题下整个柜子就是一个白盒子。
             用紫是因为青留给了短信、黄留给了灯光；**绝不能用薄荷**——
             深色主题下 --line 本身就是薄荷，填上去等于把自己的描边吃掉。 -->
        <rect x="36" y="43" width="318" height="46" rx="5" fill="var(--violet)" stroke-width="3.2"/>
        <rect x="154" y="60" width="82" height="12" rx="6" fill="var(--card)" stroke-width="3.2"/>
        <path fill="var(--card)" stroke-width="3.4" d="M42 98 L66 98 L62 114 L46 114 Z"/>
        <path fill="var(--card)" stroke-width="3.4" d="M324 98 L348 98 L344 114 L328 114 Z"/>
      </g>
      <path fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 13" opacity=".35" d="M8 118 L382 118"/>
      <!-- 充电线：状态栏里那句「充电中」是字，这根线是画。垂出画面外＝接在墙上的插座里。 -->
      <path fill="none" stroke="var(--line)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
            d="M338 17 C345 26 342 38 337 48 C332 60 339 68 349 74 C359 80 364 90 362 100 C360 109 369 116 380 116 L390 116"/>
      <g stroke="var(--line)" stroke-linejoin="round" stroke-linecap="round">
        <!-- 插头骑在手机下沿上；托架咬住底边 14 个单位，正好压住那道接缝 -->
        <rect x="330" y="8" width="16" height="13" rx="3" fill="var(--card)" stroke-width="2.8"/>
        <path fill="var(--card)" stroke-width="3.4" d="M166 2 L283 2 L311 16 L138 16 Z"/>
      </g>
    </svg>
  </div>
</div>
<p class="vtag" style="margin-top:14px">家里 · 安卓备用机</p></div></body></html>
