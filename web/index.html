<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    控制台本身**绝不进索引**——门后是全部短信明文含银行验证码。
    但 follow 要留着：站点根 / 就是这个文件，而这个站上唯一希望被搜到的页面
    是落地页 /welcome。写成 nofollow 且页面里一条链接都没有的话，爬虫从根
    进来拿不到任何可跟随的入口，「落地页要能被搜到」在真实抓取路径上就是空话。
  -->
  <meta name="robots" content="noindex, follow">
  <title>Homing</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <!--
    装到主屏幕用的一组。iOS 不认 manifest 里的 icons，只认 apple-touch-icon，
    而且不认 SVG、也不处理透明——透明区会被合成成黑色，而 logo 是黑描边的鸟，
    压在黑底上就糊了。所以那张 PNG 是铺了米白底的。
  -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homing">
  <!--
    状态栏用 default（系统给一条不透明的），不用 black-translucent。
    后者会让内容钻到刘海底下，而 style.css 只垫了 safe-area 的 bottom、没垫 top，
    .pagehead 那条吸顶返回条会被盖住——它正是为「长会话点返回不用翻到顶」存在的。
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- 两条：只写亮色的话，深色模式下安卓的任务切换卡片会出现一条突兀的米色 -->
  <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!--
    这条链接是留给爬虫的唯一入口（理由见上面 robots 那段）。
    它在 SPA 第一次 render() 时就被换掉，用户几乎看不到；
    而脚本没跑起来时它还在——那时站在根页面上的人至少有个地方可去。
  -->
  <div id="app">
    <div class="loading">加载中…
      <div style="margin-top:14px"><a href="/welcome">Homing — 卡留在家，号跟着你走</a></div>
    </div>
  </div>
  <nav id="nav" hidden>
    <a href="/" data-nav="/">总览</a>
    <a href="/events" data-nav="/events">消息</a>
    <a href="/compose" data-nav="/compose">发送</a>
    <a href="/rules" data-nav="/rules">规则</a>
    <a href="/channels" data-nav="/channels">渠道</a>
    <a href="/devices" data-nav="/devices">设备</a>
    <a href="/settings" data-nav="/settings">设置</a>
  </nav>
  <!--
    i18n 必须排在 app.js 前面：引擎把 Element.prototype.innerHTML 接管掉，
    而那一步要在任何渲染之前装上（理由见 i18n.js 顶部）。
    这两个是普通脚本，会先于 type="module"（默认 defer）执行。
  -->
  <script src="/i18n-en.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
